<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IntelliDoc — Testing Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0b0f1a;
      --surface: #111827;
      --surface-2: #1a2235;
      --border: #1e293b;
      --border-hover: #334155;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --text-muted: #64748b;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --green: #22c55e;
      --green-bg: rgba(34, 197, 94, 0.12);
      --orange: #f59e0b;
      --orange-bg: rgba(245, 158, 11, 0.12);
      --red: #ef4444;
      --red-bg: rgba(239, 68, 68, 0.12);
      --blue: #3b82f6;
      --blue-bg: rgba(59, 130, 246, 0.12);
      --radius: 12px;
      --radius-sm: 8px;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* ── Header ─────────────────────────────── */
    header {
      background: linear-gradient(135deg, rgba(99,102,241,0.08), rgba(59,130,246,0.06));
      border-bottom: 1px solid var(--border);
      padding: 20px 0;
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--accent), var(--blue));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .logo h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
    .logo span { color: var(--accent); }
    .badge {
      font-size: 11px; font-weight: 600;
      padding: 4px 10px;
      background: var(--accent-glow);
      color: var(--accent);
      border-radius: 20px;
      border: 1px solid rgba(99,102,241,0.3);
    }

    /* ── Layout ──────────────────────────────── */
    .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }

    /* ── Card ────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .card-title { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .card-body { padding: 20px; }

    /* ── Upload Zone ─────────────────────────── */
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 48px 24px;
      text-align: center;
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
    }
    .upload-zone:hover, .upload-zone.dragover {
      border-color: var(--accent);
      background: var(--accent-glow);
    }
    .upload-zone.uploading { pointer-events: none; opacity: 0.6; }
    .upload-icon { font-size: 48px; margin-bottom: 12px; }
    .upload-text { font-size: 15px; color: var(--text-dim); margin-bottom: 8px; }
    .upload-text strong { color: var(--accent); }
    .upload-hint { font-size: 12px; color: var(--text-muted); }
    #fileInput { display: none; }

    /* ── Progress Bar ────────────────────────── */
    .progress-container { margin-top: 16px; display: none; }
    .progress-container.active { display: block; }
    .progress-bar-bg {
      height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden;
    }
    .progress-bar {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--blue));
      border-radius: 3px;
      transition: width 0.4s ease;
    }
    .progress-label {
      font-size: 12px; color: var(--text-muted);
      margin-top: 8px; text-align: center;
    }

    /* ── Status Badge ────────────────────────── */
    .status {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; font-weight: 600;
      padding: 3px 10px; border-radius: 20px;
    }
    .status.uploaded { background: var(--blue-bg); color: var(--blue); }
    .status.processing { background: var(--orange-bg); color: var(--orange); }
    .status.completed { background: var(--green-bg); color: var(--green); }
    .status.failed { background: var(--red-bg); color: var(--red); }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .status.processing .status-dot { animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* ── Document List ───────────────────────── */
    .doc-list { display: flex; flex-direction: column; gap: 8px; max-height: 500px; overflow-y: auto; }
    .doc-item {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .doc-item:hover { border-color: var(--border-hover); transform: translateY(-1px); }
    .doc-item.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .doc-item-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .doc-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
    .doc-meta { font-size: 11px; color: var(--text-muted); }

    /* ── Extraction Panel ────────────────────── */
    .extraction-panel { min-height: 300px; }
    .empty-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 60px 20px; text-align: center; color: var(--text-muted);
    }
    .empty-state-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
    }
    .field-label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .field-value { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
    .field-value.null { color: var(--text-muted); font-size: 13px; font-weight: 400; font-style: italic; }
    .method-badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 12px; font-weight: 600; padding: 4px 12px;
      border-radius: 6px; margin-bottom: 16px;
    }
    .method-badge.ocr { background: var(--orange-bg); color: var(--orange); }
    .method-badge.pdf-parse { background: var(--green-bg); color: var(--green); }

    /* ── Raw Text ─────────────────────────────── */
    .raw-text-toggle {
      font-size: 12px; color: var(--accent); cursor: pointer;
      background: none; border: none; font-family: inherit;
      margin-top: 16px; display: flex; align-items: center; gap: 5px;
    }
    .raw-text-toggle:hover { text-decoration: underline; }
    .raw-text-box {
      margin-top: 10px; padding: 14px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 11px; color: var(--text-dim);
      max-height: 200px; overflow-y: auto;
      white-space: pre-wrap; word-break: break-word;
      font-family: 'SF Mono', 'Fira Code', monospace;
      display: none;
    }
    .raw-text-box.open { display: block; }

    /* ── Analytics ────────────────────────────── */
    .analytics-full { grid-column: 1 / -1; }
    .tabs { display: flex; gap: 2px; background: var(--bg); border-radius: 8px; padding: 3px; margin-bottom: 20px; }
    .tab {
      flex: 1; padding: 8px 16px; font-size: 13px; font-weight: 500; text-align: center;
      border: none; background: none; color: var(--text-muted);
      cursor: pointer; border-radius: 6px; transition: all 0.2s;
      font-family: inherit;
    }
    .tab.active { background: var(--surface-2); color: var(--text); }
    .tab:hover:not(.active) { color: var(--text-dim); }

    .analytics-table { width: 100%; border-collapse: collapse; }
    .analytics-table th {
      text-align: left; font-size: 11px; font-weight: 600;
      color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;
      padding: 10px 14px; border-bottom: 1px solid var(--border);
    }
    .analytics-table td {
      padding: 12px 14px; font-size: 13px; border-bottom: 1px solid var(--border);
    }
    .analytics-table tr:last-child td { border-bottom: none; }
    .analytics-table tr:hover td { background: rgba(255,255,255,0.02); }
    .amount { font-weight: 600; font-variant-numeric: tabular-nums; }

    /* ── Refresh Button ──────────────────────── */
    .btn-refresh {
      background: none; border: 1px solid var(--border); color: var(--text-dim);
      padding: 6px 12px; border-radius: 6px; font-size: 12px; font-family: inherit;
      cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 5px;
    }
    .btn-refresh:hover { border-color: var(--accent); color: var(--accent); }
    .btn-refresh.spinning .refresh-icon { animation: spin 0.8s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* ── Scrollbar ────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo">
        <div class="logo-icon">📄</div>
        <h1>Intelli<span>Doc</span></h1>
      </div>
      <div class="badge">Testing Dashboard</div>
    </div>
  </header>

  <div class="container">
    <!-- Upload + Document List Row -->
    <div class="grid">
      <!-- Upload Card -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">📤 Upload Document</div>
        </div>
        <div class="card-body">
          <div class="upload-zone" id="uploadZone">
            <div class="upload-icon">📄</div>
            <div class="upload-text">Drop a <strong>PDF</strong> here or click to browse</div>
            <div class="upload-hint">Max 10 MB · PDF only</div>
            <input type="file" id="fileInput" accept=".pdf,application/pdf" />
          </div>
          <div class="progress-container" id="progressContainer">
            <div class="progress-bar-bg"><div class="progress-bar" id="progressBar"></div></div>
            <div class="progress-label" id="progressLabel">Uploading...</div>
          </div>
        </div>
      </div>

      <!-- Document List Card -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">📋 Documents</div>
          <button class="btn-refresh" id="btnRefreshDocs">
            <span class="refresh-icon">↻</span> Refresh
          </button>
        </div>
        <div class="card-body">
          <div class="doc-list" id="docList">
            <div class="empty-state">
              <div class="empty-state-icon">📂</div>
              <div>No documents yet. Upload a PDF to get started.</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Extraction Results -->
    <div class="card" style="margin-bottom: 24px;">
      <div class="card-header">
        <div class="card-title">🔍 Extraction Results</div>
        <div id="extractionStatus"></div>
      </div>
      <div class="card-body extraction-panel" id="extractionPanel">
        <div class="empty-state">
          <div class="empty-state-icon">🧾</div>
          <div>Select a document to view extracted financial data</div>
        </div>
      </div>
    </div>

    <!-- Analytics -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">📊 Analytics</div>
        <button class="btn-refresh" id="btnRefreshAnalytics">
          <span class="refresh-icon">↻</span> Refresh
        </button>
      </div>
      <div class="card-body">
        <div class="tabs">
          <button class="tab active" data-tab="monthly">Monthly Summary</button>
          <button class="tab" data-tab="compare">Compare Months</button>
          <button class="tab" data-tab="vendors">By Vendor</button>
        </div>
        <div id="analyticsContent">
          <div class="empty-state">
            <div class="empty-state-icon">📈</div>
            <div>Loading analytics...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API = window.location.origin;
    let selectedDocId = null;
    let pollTimer = null;

    // ── Upload ──────────────────────────────────
    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const progressLabel = document.getElementById('progressLabel');

    uploadZone.addEventListener('click', () => fileInput.click());
    uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
    uploadZone.addEventListener('drop', e => {
      e.preventDefault();
      uploadZone.classList.remove('dragover');
      if (e.dataTransfer.files.length) uploadFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', () => { if (fileInput.files.length) uploadFile(fileInput.files[0]); });

    async function uploadFile(file) {
      if (file.type !== 'application/pdf') { alert('Only PDF files are allowed.'); return; }
      if (file.size > 10 * 1024 * 1024) { alert('File too large. Max 10 MB.'); return; }

      uploadZone.classList.add('uploading');
      progressContainer.classList.add('active');
      progressBar.style.width = '0%';
      progressLabel.textContent = 'Uploading...';

      const formData = new FormData();
      formData.append('document', file);

      try {
        // Simulate upload progress
        let progress = 0;
        const progressInterval = setInterval(() => {
          progress = Math.min(progress + Math.random() * 20, 90);
          progressBar.style.width = progress + '%';
        }, 200);

        const res = await fetch(`${API}/documents/upload`, { method: 'POST', body: formData });
        const data = await res.json();

        clearInterval(progressInterval);
        progressBar.style.width = '100%';

        if (data.success) {
          progressLabel.textContent = '✅ Uploaded! Processing...';
          selectedDocId = data.data.id;
          loadDocuments();
          startPolling(data.data.id);
        } else {
          progressLabel.textContent = '❌ ' + (data.error || 'Upload failed');
        }
      } catch (err) {
        progressLabel.textContent = '❌ Network error';
      }

      setTimeout(() => {
        uploadZone.classList.remove('uploading');
        progressContainer.classList.remove('active');
        fileInput.value = '';
      }, 3000);
    }

    // ── Polling ─────────────────────────────────
    function startPolling(docId) {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(async () => {
        const doc = await fetchDoc(docId);
        if (doc && (doc.status === 'completed' || doc.status === 'failed')) {
          clearInterval(pollTimer);
          pollTimer = null;
          loadDocuments();
          showExtraction(doc);
        }
      }, 2000);
    }

    async function fetchDoc(id) {
      try {
        const res = await fetch(`${API}/documents/${id}`);
        const data = await res.json();
        return data.success ? data.data : null;
      } catch { return null; }
    }

    // ── Document List ───────────────────────────
    async function loadDocuments() {
      const btn = document.getElementById('btnRefreshDocs');
      btn.classList.add('spinning');
      try {
        const res = await fetch(`${API}/documents?limit=50`);
        const data = await res.json();
        const list = document.getElementById('docList');

        if (!data.success || !data.data.length) {
          list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📂</div><div>No documents yet</div></div>';
          return;
        }

        list.innerHTML = data.data.map(doc => `
          <div class="doc-item ${doc.id === selectedDocId ? 'active' : ''}" onclick="selectDoc('${doc.id}')">
            <div class="doc-item-top">
              <div class="doc-name" title="${doc.original_name}">${doc.original_name}</div>
              <span class="status ${doc.status}"><span class="status-dot"></span>${doc.status}</span>
            </div>
            <div class="doc-meta">${formatSize(doc.file_size)} · ${timeAgo(doc.uploaded_at)}</div>
          </div>
        `).join('');
      } catch (err) {
        console.error('Failed to load documents:', err);
      }
      btn.classList.remove('spinning');
    }

    async function selectDoc(id) {
      selectedDocId = id;
      document.querySelectorAll('.doc-item').forEach(el => el.classList.remove('active'));
      event.currentTarget?.classList.add('active');

      const doc = await fetchDoc(id);
      if (doc) {
        showExtraction(doc);
        if (doc.status === 'processing' || doc.status === 'uploaded') startPolling(id);
      }
    }

    // ── Extraction Panel ────────────────────────
    function showExtraction(doc) {
      const panel = document.getElementById('extractionPanel');
      const statusEl = document.getElementById('extractionStatus');

      statusEl.innerHTML = `<span class="status ${doc.status}"><span class="status-dot"></span>${doc.status}</span>`;

      if (doc.status === 'processing' || doc.status === 'uploaded') {
        panel.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon" style="animation: pulse 1.5s infinite">⏳</div>
            <div>Processing document... This may take a minute for OCR.</div>
          </div>`;
        return;
      }

      if (doc.status === 'failed') {
        panel.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">❌</div>
            <div>Processing failed: ${doc.error_message || 'Unknown error'}</div>
          </div>`;
        return;
      }

      const rec = doc.financialRecords?.[0];
      if (!rec) {
        panel.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🤷</div><div>No financial data extracted</div></div>';
        return;
      }

      const methodClass = rec.extraction_method || 'pdf-parse';
      const methodLabel = rec.extraction_method === 'ocr' ? '🔍 OCR (Tesseract.js)' : '📄 PDF Text (pdf-parse)';

      panel.innerHTML = `
        <div class="method-badge ${methodClass}">${methodLabel}</div>
        <div class="field-grid">
          <div class="field-card">
            <div class="field-label">📅 Invoice Date</div>
            <div class="field-value ${rec.invoice_date ? '' : 'null'}">${rec.invoice_date || 'Not detected'}</div>
          </div>
          <div class="field-card">
            <div class="field-label">🏢 Vendor</div>
            <div class="field-value ${rec.vendor ? '' : 'null'}">${rec.vendor || 'Not detected'}</div>
          </div>
          <div class="field-card">
            <div class="field-label">💰 Total Amount</div>
            <div class="field-value ${rec.total_amount ? '' : 'null'}">${rec.total_amount ? '₹' + formatNum(rec.total_amount) : 'Not detected'}</div>
          </div>
          <div class="field-card">
            <div class="field-label">🧾 GST</div>
            <div class="field-value ${rec.gst ? '' : 'null'}">${rec.gst ? '₹' + formatNum(rec.gst) : 'Not detected'}</div>
          </div>
        </div>
        <button class="raw-text-toggle" onclick="toggleRawText()">▶ Show extracted raw text</button>
        <div class="raw-text-box" id="rawTextBox">${escapeHtml(rec.raw_text || 'No text extracted')}</div>
      `;
    }

    function toggleRawText() {
      const box = document.getElementById('rawTextBox');
      const btn = event.currentTarget;
      box.classList.toggle('open');
      btn.textContent = box.classList.contains('open') ? '▼ Hide raw text' : '▶ Show extracted raw text';
    }

    // ── Analytics ────────────────────────────────
    let currentTab = 'monthly';

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentTab = tab.dataset.tab;
        loadAnalytics();
      });
    });

    async function loadAnalytics() {
      const content = document.getElementById('analyticsContent');
      const btn = document.getElementById('btnRefreshAnalytics');
      btn.classList.add('spinning');

      const endpoints = {
        monthly: '/analytics/monthly-summary',
        compare: '/analytics/compare-months',
        vendors: '/analytics/vendor-totals',
      };

      try {
        const res = await fetch(`${API}${endpoints[currentTab]}`);
        const data = await res.json();

        if (!data.success || !data.data.length) {
          content.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📈</div><div>No analytics data yet. Upload and process some documents first.</div></div>';
          btn.classList.remove('spinning');
          return;
        }

        if (currentTab === 'vendors') {
          content.innerHTML = `
            <table class="analytics-table">
              <thead><tr><th>Vendor</th><th>Bills</th><th>Total Amount</th><th>GST</th></tr></thead>
              <tbody>${data.data.map(r => `
                <tr>
                  <td>${r.vendor}</td>
                  <td>${r.total_bills}</td>
                  <td class="amount">₹${formatNum(r.total_amount)}</td>
                  <td class="amount">₹${formatNum(r.total_gst)}</td>
                </tr>`).join('')}
              </tbody>
            </table>`;
        } else {
          content.innerHTML = `
            <table class="analytics-table">
              <thead><tr><th>Month</th><th>Bills</th><th>Total Amount</th><th>Total GST</th></tr></thead>
              <tbody>${data.data.map(r => `
                <tr>
                  <td>${r.month}</td>
                  <td>${r.total_bills}</td>
                  <td class="amount">₹${formatNum(r.total_amount)}</td>
                  <td class="amount">₹${formatNum(r.total_gst)}</td>
                </tr>`).join('')}
              </tbody>
            </table>`;
        }
      } catch (err) {
        content.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div>Failed to load analytics</div></div>';
      }
      btn.classList.remove('spinning');
    }

    // ── Helpers ──────────────────────────────────
    function formatNum(n) {
      return Number(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function formatSize(bytes) {
      if (!bytes) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return (bytes / Math.pow(k, i)).toFixed(1) + ' ' + sizes[i];
    }
    function timeAgo(iso) {
      const diff = (Date.now() - new Date(iso).getTime()) / 1000;
      if (diff < 60) return 'just now';
      if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
      if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
      return new Date(iso).toLocaleDateString();
    }
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ── Event Listeners ─────────────────────────
    document.getElementById('btnRefreshDocs').addEventListener('click', loadDocuments);
    document.getElementById('btnRefreshAnalytics').addEventListener('click', loadAnalytics);

    // ── Init ────────────────────────────────────
    loadDocuments();
    loadAnalytics();
  </script>
</body>
</html>
