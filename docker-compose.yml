# ──────────────────────────────────────────────
# IntelliDoc — Docker Compose
# ──────────────────────────────────────────────
# Services: Redis, Node.js API, Python Worker
# Database: External (Supabase via DATABASE_URL)
# ──────────────────────────────────────────────

version: "3.9"

services:
  # ─── PostgreSQL ────────────────────────────
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: intellidoc
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: intellidoc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U intellidoc -d intellidoc" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis ─────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Node.js API ──────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://intellidoc:password123@db:5432/intellidoc
      - UPLOAD_DIR=/app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  # ─── Python Worker ────────────────────────
  worker:
    build:
      context: ./worker
      dockerfile: ../Dockerfile.worker
    env_file:
      - ./worker/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://intellidoc:password123@db:5432/intellidoc
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
    volumes:
      - uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

volumes:
  redis_data:
  uploads:
  postgres_data:
