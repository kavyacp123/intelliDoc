<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IntelliDoc — Document AI Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        :root {
            --bg: #0b0f1a;
            --surface: #111827;
            --surface-2: #1a2235;
            --border: #1e293b;
            --border-hover: #334155;
            --text: #e2e8f0;
            --text-dim: #94a3b8;
            --text-muted: #64748b;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, .25);
            --green: #22c55e;
            --green-bg: rgba(34, 197, 94, .12);
            --orange: #f59e0b;
            --orange-bg: rgba(245, 158, 11, .12);
            --red: #ef4444;
            --red-bg: rgba(239, 68, 68, .12);
            --blue: #3b82f6;
            --blue-bg: rgba(59, 130, 246, .12);
            --yellow: #eab308;
            --yellow-bg: rgba(234, 179, 8, .12);
            --radius: 12px;
            --radius-sm: 8px;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5
        }

        header {
            background: linear-gradient(135deg, rgba(99, 102, 241, .08), rgba(59, 130, 246, .06));
            border-bottom: 1px solid var(--border);
            padding: 20px 0
        }

        .header-inner {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent), var(--blue));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px
        }

        .logo h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -.5px
        }

        .logo span {
            color: var(--accent)
        }

        .badge {
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            background: var(--accent-glow);
            color: var(--accent);
            border-radius: 20px;
            border: 1px solid rgba(99, 102, 241, .3)
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 24px
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 24px
        }

        @media(max-width:768px) {
            .grid {
                grid-template-columns: 1fr
            }
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden
        }

        .card-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px
        }

        .card-body {
            padding: 20px
        }

        .upload-zone {
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            padding: 48px 24px;
            text-align: center;
            transition: all .3s;
            cursor: pointer
        }

        .upload-zone:hover,
        .upload-zone.dragover {
            border-color: var(--accent);
            background: var(--accent-glow)
        }

        .upload-zone.uploading {
            pointer-events: none;
            opacity: .6
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 12px
        }

        .upload-text {
            font-size: 15px;
            color: var(--text-dim);
            margin-bottom: 8px
        }

        .upload-text strong {
            color: var(--accent)
        }

        .upload-hint {
            font-size: 12px;
            color: var(--text-muted)
        }

        #fileInput {
            display: none
        }

        .progress-container {
            margin-top: 16px;
            display: none
        }

        .progress-container.active {
            display: block
        }

        .progress-bar-bg {
            height: 6px;
            background: var(--surface-2);
            border-radius: 3px;
            overflow: hidden
        }

        .progress-bar {
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, var(--accent), var(--blue));
            border-radius: 3px;
            transition: width .4s
        }

        .progress-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 8px;
            text-align: center
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 20px
        }

        .status.uploaded {
            background: var(--blue-bg);
            color: var(--blue)
        }

        .status.processing {
            background: var(--orange-bg);
            color: var(--orange)
        }

        .status.completed {
            background: var(--green-bg);
            color: var(--green)
        }

        .status.failed {
            background: var(--red-bg);
            color: var(--red)
        }

        .status.needs_review {
            background: var(--yellow-bg);
            color: var(--yellow)
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor
        }

        .status.processing .status-dot {
            animation: pulse 1.5s infinite
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: .3
            }
        }

        .doc-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 500px;
            overflow-y: auto
        }

        .doc-item {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            cursor: pointer;
            transition: all .2s
        }

        .doc-item:hover {
            border-color: var(--border-hover);
            transform: translateY(-1px)
        }

        .doc-item.active {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent)
        }

        .doc-item-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px
        }

        .doc-name {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px
        }

        .doc-meta {
            font-size: 11px;
            color: var(--text-muted)
        }

        .extraction-panel {
            min-height: 300px
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            text-align: center;
            color: var(--text-muted)
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: .5
        }

        .field-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px
        }

        .field-card {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 14px 16px
        }

        .field-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: .5px;
            margin-bottom: 6px
        }

        .field-value {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -.3px
        }

        .field-value.null {
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 400;
            font-style: italic
        }

        .confidence-bar {
            margin-top: 16px;
            display: flex;
            align-items: center;
            gap: 10px
        }

        .confidence-track {
            flex: 1;
            height: 6px;
            background: var(--surface-2);
            border-radius: 3px;
            overflow: hidden
        }

        .confidence-fill {
            height: 100%;
            border-radius: 3px;
            transition: width .5s
        }

        .confidence-label {
            font-size: 12px;
            font-weight: 600;
            min-width: 50px;
            text-align: right
        }

        .section-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-dim);
            margin: 20px 0 10px;
            text-transform: uppercase;
            letter-spacing: .5px
        }

        .line-items-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px
        }

        .line-items-table th {
            text-align: left;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: .5px;
            padding: 8px 12px;
            border-bottom: 1px solid var(--border)
        }

        .line-items-table td {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border)
        }

        .line-items-table tr:last-child td {
            border-bottom: none
        }

        .raw-text-toggle {
            font-size: 12px;
            color: var(--accent);
            cursor: pointer;
            background: none;
            border: none;
            font-family: inherit;
            margin-top: 16px;
            display: flex;
            align-items: center;
            gap: 5px
        }

        .raw-text-toggle:hover {
            text-decoration: underline
        }

        .raw-text-box {
            margin-top: 10px;
            padding: 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 11px;
            color: var(--text-dim);
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: 'SF Mono', 'Fira Code', monospace;
            display: none
        }

        .raw-text-box.open {
            display: block
        }

        .tabs {
            display: flex;
            gap: 2px;
            background: var(--bg);
            border-radius: 8px;
            padding: 3px;
            margin-bottom: 20px
        }

        .tab {
            flex: 1;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            border: none;
            background: none;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 6px;
            transition: all .2s;
            font-family: inherit
        }

        .tab.active {
            background: var(--surface-2);
            color: var(--text)
        }

        .tab:hover:not(.active) {
            color: var(--text-dim)
        }

        .analytics-table {
            width: 100%;
            border-collapse: collapse
        }

        .analytics-table th {
            text-align: left;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: .5px;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border)
        }

        .analytics-table td {
            padding: 12px 14px;
            font-size: 13px;
            border-bottom: 1px solid var(--border)
        }

        .analytics-table tr:last-child td {
            border-bottom: none
        }

        .amount {
            font-weight: 600;
            font-variant-numeric: tabular-nums
        }

        .btn-refresh {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-family: inherit;
            cursor: pointer;
            transition: all .2s;
            display: flex;
            align-items: center;
            gap: 5px
        }

        .btn-refresh:hover {
            border-color: var(--accent);
            color: var(--accent)
        }

        .btn-refresh.spinning .refresh-icon {
            animation: spin .8s linear infinite
        }

        @keyframes spin {
            from {
                transform: rotate(0deg)
            }

            to {
                transform: rotate(360deg)
            }
        }

        ::-webkit-scrollbar {
            width: 6px
        }

        ::-webkit-scrollbar-track {
            background: transparent
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px
        }
    </style>
</head>

<body>
    <header>
        <div class="header-inner">
            <div class="logo">
                <div class="logo-icon">📄</div>
                <h1>Intelli<span>Doc</span></h1>
            </div>
            <div class="badge">Document AI Dashboard</div>
        </div>
    </header>
    <div class="container">
        <div class="grid">
            <div class="card">
                <div class="card-header">
                    <div class="card-title">📤 Upload Document</div>
                </div>
                <div class="card-body">
                    <div class="upload-zone" id="uploadZone">
                        <div class="upload-icon">📄</div>
                        <div class="upload-text">Drop a <strong>PDF / Image</strong> here or click to browse</div>
                        <div class="upload-hint">PDF, PNG, JPEG, TIFF · Max 50 MB</div>
                        <input type="file" id="fileInput" accept=".pdf,.png,.jpg,.jpeg,.tiff,.tif" />
                    </div>
                    <div class="progress-container" id="progressContainer">
                        <div class="progress-bar-bg">
                            <div class="progress-bar" id="progressBar"></div>
                        </div>
                        <div class="progress-label" id="progressLabel">Uploading...</div>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-header">
                    <div class="card-title">📋 Documents</div>
                    <button class="btn-refresh" id="btnRefreshDocs"><span class="refresh-icon">↻</span> Refresh</button>
                </div>
                <div class="card-body">
                    <div class="doc-list" id="docList">
                        <div class="empty-state">
                            <div class="empty-state-icon">📂</div>
                            <div>No documents yet</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="card" style="margin-bottom:24px">
            <div class="card-header">
                <div class="card-title">🔍 Extraction Results</div>
                <div id="extractionStatus"></div>
            </div>
            <div class="card-body extraction-panel" id="extractionPanel">
                <div class="empty-state">
                    <div class="empty-state-icon">🧾</div>
                    <div>Select a document to view extracted data</div>
                </div>
            </div>
        </div>
        <div class="card">
            <div class="card-header">
                <div class="card-title">📊 Analytics</div>
                <button class="btn-refresh" id="btnRefreshAnalytics"><span class="refresh-icon">↻</span>
                    Refresh</button>
            </div>
            <div class="card-body">
                <div class="tabs">
                    <button class="tab active" data-tab="monthly">Monthly Summary</button>
                    <button class="tab" data-tab="compare">Compare Months</button>
                    <button class="tab" data-tab="vendors">By Vendor</button>
                </div>
                <div id="analyticsContent">
                    <div class="empty-state">
                        <div class="empty-state-icon">📈</div>
                        <div>Loading...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const API = location.origin; let selectedDocId = null, pollTimer = null;
        const $ = id => document.getElementById(id);
        const uploadZone = $('uploadZone'), fileInput = $('fileInput'),
            progressContainer = $('progressContainer'), progressBar = $('progressBar'), progressLabel = $('progressLabel');

        uploadZone.addEventListener('click', () => fileInput.click());
        uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover') });
        uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
        uploadZone.addEventListener('drop', e => { e.preventDefault(); uploadZone.classList.remove('dragover'); if (e.dataTransfer.files.length) uploadFile(e.dataTransfer.files[0]) });
        fileInput.addEventListener('change', () => { if (fileInput.files.length) uploadFile(fileInput.files[0]) });

        async function uploadFile(file) {
            if (file.size > 50 * 1024 * 1024) { alert('File too large. Max 50 MB.'); return }
            uploadZone.classList.add('uploading'); progressContainer.classList.add('active'); progressBar.style.width = '0%'; progressLabel.textContent = 'Uploading...';
            const fd = new FormData(); fd.append('document', file);
            let p = 0; const pi = setInterval(() => { p = Math.min(p + Math.random() * 20, 90); progressBar.style.width = p + '%' }, 200);
            try {
                const res = await fetch(`${API}/documents/upload`, { method: 'POST', body: fd }); const data = await res.json();
                clearInterval(pi); progressBar.style.width = '100%';
                if (data.success) { progressLabel.textContent = '✅ Queued for processing!'; selectedDocId = data.data.id; loadDocuments(); startPolling(data.data.id) }
                else { progressLabel.textContent = '❌ ' + (data.error || 'Failed') }
            } catch (e) { clearInterval(pi); progressLabel.textContent = '❌ Network error' }
            setTimeout(() => { uploadZone.classList.remove('uploading'); progressContainer.classList.remove('active'); fileInput.value = '' }, 3000);
        }

        function startPolling(id) { if (pollTimer) clearInterval(pollTimer); pollTimer = setInterval(async () => { const d = await fetchDoc(id); if (d && !['uploaded', 'processing'].includes(d.status)) { clearInterval(pollTimer); pollTimer = null; loadDocuments(); showExtraction(d) } }, 2000) }
        async function fetchDoc(id) { try { const r = await fetch(`${API}/documents/${id}`); const d = await r.json(); return d.success ? d.data : null } catch { return null } }

        async function loadDocuments() {
            $('btnRefreshDocs').classList.add('spinning');
            try {
                const r = await fetch(`${API}/documents?limit=50`); const d = await r.json(); const list = $('docList');
                if (!d.success || !d.data.length) { list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📂</div><div>No documents yet</div></div>'; return }
                list.innerHTML = d.data.map(doc => `
      <div class="doc-item ${doc.id === selectedDocId ? 'active' : ''}" onclick="selectDoc('${doc.id}',this)">
        <div class="doc-item-top">
          <div class="doc-name" title="${doc.original_name}">${doc.original_name}</div>
          <span class="status ${doc.status}"><span class="status-dot"></span>${doc.status.replace('_', ' ')}</span>
        </div>
        <div class="doc-meta">${doc.page_count ? doc.page_count + ' pages · ' : ''}${fmtSize(doc.file_size)} · ${timeAgo(doc.uploaded_at)}</div>
      </div>`).join('');
            } catch (e) { console.error(e) }
            $('btnRefreshDocs').classList.remove('spinning');
        }

        async function selectDoc(id, el) {
            selectedDocId = id; document.querySelectorAll('.doc-item').forEach(e => e.classList.remove('active')); el?.classList.add('active');
            const doc = await fetchDoc(id); if (doc) { showExtraction(doc); if (['uploaded', 'processing'].includes(doc.status)) startPolling(id) }
        }

        function showExtraction(doc) {
            const panel = $('extractionPanel'), statusEl = $('extractionStatus');
            statusEl.innerHTML = `<span class="status ${doc.status}"><span class="status-dot"></span>${doc.status.replace('_', ' ')}</span>`;
            if (['uploaded', 'processing'].includes(doc.status)) { panel.innerHTML = `<div class="empty-state"><div class="empty-state-icon" style="animation:pulse 1.5s infinite">⏳</div><div>Processing... This may take a minute.</div></div>`; return }
            if (doc.status === 'failed') { panel.innerHTML = `<div class="empty-state"><div class="empty-state-icon">❌</div><div>Failed: ${doc.error_message || 'Unknown'}</div></div>`; return }
            const recs = doc.invoiceRecords || [];
            if (!recs.length) { panel.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🤷</div><div>No data extracted</div></div>'; return }
            let html = '';
            recs.forEach((rec, i) => {
                const conf = rec.confidence_score || 0; const confColor = conf >= .8 ? 'var(--green)' : conf >= .6 ? 'var(--orange)' : 'var(--red)';
                html += `${recs.length > 1 ? `<div class="section-label">📄 Page ${rec.page_number || i + 1}</div>` : ''}`;
                html += `<div class="confidence-bar"><span style="font-size:12px;color:var(--text-muted)">OCR Confidence</span><div class="confidence-track"><div class="confidence-fill" style="width:${conf * 100}%;background:${confColor}"></div></div><span class="confidence-label" style="color:${confColor}">${(conf * 100).toFixed(0)}%</span></div>`;
                html += `<div class="field-grid" style="margin-top:16px">`;
                html += fieldCard('📅 Invoice Date', rec.invoice_date);
                html += fieldCard('🔢 Invoice No.', rec.invoice_number);
                html += fieldCard('🏢 Vendor', rec.vendor);
                html += fieldCard('📋 Subtotal', rec.subtotal, '₹');
                html += fieldCard('🏛 CGST', rec.cgst, '₹');
                html += fieldCard('🏛 SGST', rec.sgst, '₹');
                html += fieldCard('🌐 IGST', rec.igst, '₹');
                html += fieldCard('💰 Grand Total', rec.grand_total, '₹');
                html += `</div>`;
                const items = typeof rec.line_items === 'string' ? JSON.parse(rec.line_items || '[]') : rec.line_items || [];
                if (items.length) {
                    html += `<div class="section-label">📊 Line Items</div>`;
                    const cols = Object.keys(items[0]);
                    html += `<table class="line-items-table"><thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>`;
                    items.forEach(row => { html += `<tr>${cols.map(c => `<td>${row[c] || ''}</td>`).join('')}</tr>` });
                    html += `</tbody></table>`;
                }
                if (rec.raw_ocr_text) {
                    html += `<button class="raw-text-toggle" onclick="this.nextElementSibling.classList.toggle('open');this.textContent=this.nextElementSibling.classList.contains('open')?'▼ Hide raw text':'▶ Show raw text'">▶ Show raw text</button>`;
                    html += `<div class="raw-text-box">${esc(rec.raw_ocr_text)}</div>`;
                }
                if (i < recs.length - 1) html += '<hr style="border:none;border-top:1px solid var(--border);margin:20px 0">';
            });
            panel.innerHTML = html;
        }

        function fieldCard(label, value, prefix = '') {
            const v = value != null ? `${prefix}${typeof value === 'number' ? fmtNum(value) : value}` : 'Not detected';
            return `<div class="field-card"><div class="field-label">${label}</div><div class="field-value ${value == null ? 'null' : ''}">${v}</div></div>`;
        }

        let currentTab = 'monthly';
        document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => { document.querySelectorAll('.tab').forEach(x => x.classList.remove('active')); t.classList.add('active'); currentTab = t.dataset.tab; loadAnalytics() }));
        async function loadAnalytics() {
            $('btnRefreshAnalytics').classList.add('spinning');
            const ep = { monthly: '/analytics/monthly-summary', compare: '/analytics/compare-months', vendors: '/analytics/vendor-totals' };
            try {
                const r = await fetch(`${API}${ep[currentTab]}`); const d = await r.json(); const c = $('analyticsContent');
                if (!d.success || !d.data.length) { c.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📈</div><div>No data yet</div></div>'; return }
                if (currentTab === 'vendors') {
                    c.innerHTML = `<table class="analytics-table"><thead><tr><th>Vendor</th><th>Invoices</th><th>Revenue</th><th>Tax</th></tr></thead><tbody>${d.data.map(r => `<tr><td>${r.vendor}</td><td>${r.total_invoices}</td><td class="amount">₹${fmtNum(r.total_revenue)}</td><td class="amount">₹${fmtNum(r.total_tax)}</td></tr>`).join('')}</tbody></table>`;
                } else {
                    c.innerHTML = `<table class="analytics-table"><thead><tr><th>Month</th><th>Invoices</th><th>Revenue</th><th>CGST</th><th>SGST</th><th>IGST</th></tr></thead><tbody>${d.data.map(r => `<tr><td>${r.month}</td><td>${r.total_invoices}</td><td class="amount">₹${fmtNum(r.total_revenue)}</td><td class="amount">₹${fmtNum(r.total_cgst)}</td><td class="amount">₹${fmtNum(r.total_sgst)}</td><td class="amount">₹${fmtNum(r.total_igst)}</td></tr>`).join('')}</tbody></table>`;
                }
            } catch (e) { $('analyticsContent').innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div>Failed to load</div></div>' }
            $('btnRefreshAnalytics').classList.remove('spinning');
        }

        function fmtNum(n) { return Number(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) }
        function fmtSize(b) { if (!b) return '0 B'; const k = 1024, s = ['B', 'KB', 'MB']; const i = Math.floor(Math.log(b) / Math.log(k)); return (b / Math.pow(k, i)).toFixed(1) + ' ' + s[i] }
        function timeAgo(iso) { const d = (Date.now() - new Date(iso).getTime()) / 1e3; if (d < 60) return 'just now'; if (d < 3600) return Math.floor(d / 60) + 'm ago'; if (d < 86400) return Math.floor(d / 3600) + 'h ago'; return new Date(iso).toLocaleDateString() }
        function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML }

        $('btnRefreshDocs').addEventListener('click', loadDocuments);
        $('btnRefreshAnalytics').addEventListener('click', loadAnalytics);
        loadDocuments(); loadAnalytics();
    </script>
</body>

</html>
