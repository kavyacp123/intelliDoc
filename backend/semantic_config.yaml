# ── Semantic Layer Configuration ──
# Maps business-friendly names to SQL expressions.
# Used by the Query Builder to generate controlled SQL
# from structured intents.

# Default time column for time-based queries
time_column: date

# Metrics — aggregation expressions
metrics:
  revenue: "SUM(sales)"
  profit: "SUM(profit)"
  sales: "SUM(sales)"
  cogs: "SUM(cogs)"
  total_profit: "SUM(profit)"
  total_sales: "SUM(sales)"
  order_count: "COUNT(*)"

# Dimensions — grouping expressions
dimensions:
  segment: "segment"
  country: "country"
  product: "product"
  month: "DATE_TRUNC('month', date)"
  quarter: "DATE_TRUNC('quarter', date)"
  year: "DATE_TRUNC('year', date)"
  day: "DATE_TRUNC('day', date)"
